<!DOCTYPE html>
<html lang="en">
<head>
    <link href ="css/loggedin.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
</head>

    <body onload = "displayTen();">
    <div class="sidebar">
        <p id ="sidebarTitle">Contact Manager</p>
        <button id="viewAll" onclick="displayAll();">
            <img src="images/eye.png"> <br/>    <span>View All Contacts</span>
        </button>

    <button id="addContact" onclick="addContact();">
        <span id="addPlus">+</span>
        <span id="addTxt">Add New Contacts</span>
</button>
    </div>
    <div class = mainContent>
    <h1>Welcome</h1>
    <input type ="text" placeholder="Search Contacts" id="search" oninput = "search();">

    <br/><br/><br/><br/>

    
    <div class ="contactsBox">

       <table id="contactTable">
         <thead>
           <tr>
     	      <th>First Name</th>
               <th>Last Name</th>
               <th>Number</th>
               <th>Email</th>
	       <th>Edit</th>
	       <th>Delete</th>
           </tr>
 	 </thead>
	 <tbody id="contactTableBody">
	 </tbody>
       </table>	

    </div>
    <h3 id="searchTitle">Search Results</h3>
    <table id="Result">
        <thead>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Number</th>
        <th>Email</th>
        </thead>
        <tbody id = ResultBody></tbody>
    </table>

    <p id ="hint">Start typing above to search for specific contacts, or press the view all button below to see everyone
        on your contact list.       
    </p>

    <div class="tensB">
    <table id="tens">
        <thead>
           <tr>
     	      <th>First Name</th>
               <th>Last Name</th>
               <th>Number</th>
               <th>Email</th>
            </tr>
        </thead>
        <tbody id= "tensBody">

        </tbody>
    </table>
    </div>
        <button id="load" onclick="displayTen();">Load More</button><br/>


    

    <div class="addContactPB">
        <br/>
        <input type="text" id ="firstN" placeholder="First Name"><br/>
        <input type="text" id ="lastN" placeholder="Last Name"><br/>
        <input type="text" id ="phoneN" placeholder="Phone Number"><br/>
        <input type="text" id ="email" placeholder="Email">
        <br/>
        <button id ="verifyContact" onclick="verifyContact();">Add</button>
        <button id ="cancel" onclick="cancelAdd();">Cancel</button>

    </div>

    <button id = "signOutB" 
    onclick="window.location.href='index.html' ">Sign out</button>
    </div>
    <script src="js/loggedin.js" type="text/javascript"></script>
</body>
</html>
